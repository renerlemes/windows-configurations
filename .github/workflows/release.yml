name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  PROJECT: Windows.Configurations

jobs:
  Release:
    env:
      DOTNET_VERSION: "10.0.x"
    runs-on: windows-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Application - Version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Dotnet - Use ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Dotnet - Publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $PWD 'publish'
          if (Test-Path $publishDir) { Remove-Item $publishDir -Recurse -Force }

          $version = '${{ steps.version.outputs.version }}'
          dotnet publish "$env:PROJECT.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:Version=$version `
            -p:FileVersion=$version `
            -p:AssemblyVersion=$version `
            -o $publishDir

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

      - name: Dependency - Inno Setup (Configure)
        shell: pwsh
        run: |
          $regPaths = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
          )

          $isccPath = $null
          foreach ($rp in $regPaths) {
            if (Test-Path $rp) {
              $installDir = (Get-ItemProperty $rp).InstallLocation
              $candidate = Join-Path $installDir 'ISCC.exe'
              if (Test-Path $candidate) {
                $isccPath = $candidate
                break
              }
            }
          }

          if (-not $isccPath) {
            winget install --id=JRSoftware.InnoSetup --exact --source winget --scope machine --accept-package-agreements --accept-source-agreements
            if ($LASTEXITCODE -ne 0) {
              throw "winget install failed with exit code $LASTEXITCODE"
            }

            foreach ($rp in $regPaths) {
              if (Test-Path $rp) {
                $installDir = (Get-ItemProperty $rp).InstallLocation
                $candidate = Join-Path $installDir 'ISCC.exe'
                if (Test-Path $candidate) {
                  $isccPath = $candidate
                  break
                }
              }
            }
          }

          if (-not $isccPath) {
            throw 'ISCC.exe not found after Inno Setup install.'
          }

          "iscc=$isccPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Dependency - Inno Setup (Build Installer)
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $publishDir = (Resolve-Path 'publish').Path
          $iss = Join-Path $PWD 'Installer\Setup.iss'

          & $env:iscc `
            "/DMyAppVersion=$version" `
            "/DMyAppPublishDir=$publishDir" `
            $iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

          $installer = Get-ChildItem 'artifacts\*_Setup.exe' | Select-Object -First 1
          if (-not $installer) {
            throw 'Installer not found in artifacts\'
          }

          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        id: installer

      - name: GitHub - Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $installer = '${{ steps.installer.outputs.installer }}'

          gh release create $tag $installer `
            --repo '${{ github.repository }}' `
            --title "Windows Configurations $version" `
            --generate-notes
